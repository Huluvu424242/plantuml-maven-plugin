name: Deploy Release

on:
  push:
    branches:
      - 'release/**'
      - '!release/**-snapshot'

jobs:
  deploy:
    name: deploy on github
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v1
    - name: Setup Graphviz
      uses: ts-graphviz/setup-graphviz@v1
    - name: Set up JDK 8
      uses: actions/setup-java@v3
      with:
        distribution: 'zulu'
        java-version: '8'
        java-package: jdk
        cache: 'maven'
    - name: Deploy to Github Package Registry
      run: ./mvnw -U -Prelease clean site install deploy
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
