name: Github CI Build

on: [push]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v2
    - name: Set up JDK 17
      uses: actions/setup-java@v2
      with:
        java-version: '17'
    - name: Build with Maven
      run: |
        ./mvnw    clean site install
        ./mvnw -U -PpruefeVersionen,release clean site install
        

